services:
  db:
    image: mysql:8.0
    container_name: formulario_rh_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - formulario_rh_mysql_prod_v3:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - formulario_rh_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: formulario-rh-app:production
    container_name: formulario_rh_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - formulario_rh_storage_prod_v3:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$s=@fsockopen(\"127.0.0.1\",9000,$e,$m,2); if(!$s){exit(1);} fclose($s);'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10m
    networks:
      - formulario_rh_network

  nginx:
    image: nginx:alpine
    container_name: formulario_rh_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - .:/var/www/html:ro
      - formulario_rh_storage_prod_v3:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - formulario_rh_network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.rh.rule=Host(`rh.prosalongroup.com`)"
      - "traefik.http.routers.rh.entrypoints=websecure"
      - "traefik.http.routers.rh.tls=true"
      - "traefik.http.routers.rh.tls.certresolver=le"
      - "traefik.http.routers.rh.service=rh"
      - "traefik.http.services.rh.loadbalancer.server.port=80"
      - "traefik.http.routers.rh-http.rule=Host(`rh.prosalongroup.com`)"
      - "traefik.http.routers.rh-http.entrypoints=web"
      - "traefik.http.routers.rh-http.middlewares=rh-redirect-https"
      - "traefik.http.middlewares.rh-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.rh-redirect-https.redirectscheme.permanent=true"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: formulario_rh_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - formulario_rh_network

volumes:
  formulario_rh_mysql_prod_v3:
    name: formulario_rh_mysql_prod_v3
  formulario_rh_storage_prod_v3:
    name: formulario_rh_storage_prod_v3

networks:
  formulario_rh_network:
    driver: bridge
  traefik_proxy:
    external: true
    name: root_default
